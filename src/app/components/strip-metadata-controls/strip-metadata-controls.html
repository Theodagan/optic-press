<fieldset class="strip-metadata-controls__group">
  <legend class="strip-metadata-controls__legend">Metadata removal</legend>
  <p class="strip-metadata-controls__info">
    EXIF data is always stripped via canvas redraw. Color profile and ICC
    information cannot be preserved or selectively removed with browser canvas
    APIs alone.
  </p>
</fieldset>

<fieldset class="strip-metadata-controls__group">
  <legend class="strip-metadata-controls__legend">Output format</legend>
  <select
    class="strip-metadata-controls__select"
    [value]="settings().outputFormat"
    (change)="onFormatChange($any($event.target).value)"
  >
    @for (format of formatOrder; track format) {
      <option [value]="format">{{ formatLabels[format] }}</option>
    }
  </select>
</fieldset>

@if (settings().outputFormat !== 'same') {
  <fieldset class="strip-metadata-controls__group">
    <legend class="strip-metadata-controls__legend">Quality</legend>
    <div class="strip-metadata-controls__quality-row">
      <input
        type="range"
        class="strip-metadata-controls__range"
        min="1"
        max="100"
        [value]="settings().quality"
        (input)="onQualityChange($any($event.target).value)"
      />
      <output class="strip-metadata-controls__quality-value">{{ settings().quality }}</output>
    </div>
  </fieldset>
}
