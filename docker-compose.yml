services:
  dev:
    image: oven/bun:1.3.10
    working_dir: /app
    command: sh -c "bun install && bun run ng serve --host 0.0.0.0 --poll 1000"
    ports:
      - "${DEV_PORT:-4200}:4200"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - bun_cache:/root/.bun
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"

  prod:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PROD_PORT:-8080}:80"

volumes:
  node_modules:
  bun_cache:
